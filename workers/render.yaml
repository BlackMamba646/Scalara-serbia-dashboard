services:
  - type: web
    name: scalara-radar-workers
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://scalara-serbia-dashboard.vercel.app
      - key: LLM_API_KEY
        sync: false

  - type: cron
    name: scalara-crawl-regulators
    runtime: image
    schedule: "0 0 * * *"
    dockerCommand: ["curl", "-X", "POST", "https://scalara-radar-workers.onrender.com/cron/regulators"]
    envVars: []

  - type: cron
    name: scalara-crawl-news
    runtime: image
    schedule: "15 */6 * * *"
    dockerCommand: ["curl", "-X", "POST", "https://scalara-radar-workers.onrender.com/cron/news"]
    envVars: []

  - type: cron
    name: scalara-crawl-ct
    runtime: image
    schedule: "30 3,15 * * *"
    dockerCommand: ["curl", "-X", "POST", "https://scalara-radar-workers.onrender.com/cron/ct"]
    envVars: []

  - type: cron
    name: scalara-crawl-complaints
    runtime: image
    schedule: "0 2 * * *"
    dockerCommand: ["curl", "-X", "POST", "https://scalara-radar-workers.onrender.com/cron/complaints"]
    envVars: []
